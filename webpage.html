//internet controlled car webpage
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Internet Robot Car Remote</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include MQTT.js for WebSocket communication -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        /* Prevent text selection and long-press menus on mobile while driving */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .btn-active {
            transform: scale(0.95);
            background-color: #3b82f6 !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center font-sans">

    <div class="w-full max-w-md p-6 bg-gray-800 rounded-3xl shadow-2xl flex flex-col items-center">
        <h1 class="text-2xl font-bold mb-2 tracking-wider text-blue-400">ROBOT COMMAND</h1>
        
        <!-- Connection Status -->
        <div class="flex items-center space-x-2 mb-6">
            <div id="statusIndicator" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
            <span id="statusText" class="text-sm font-medium text-gray-300">Disconnected</span>
        </div>

        <!-- Settings Panel -->
        <div class="w-full bg-gray-700 p-4 rounded-xl mb-4 space-y-3">
            <div>
                <label class="block text-xs text-gray-400 mb-1">Secret Channel Name (Must match NodeMCU)</label>
                <input type="text" id="topicInput" value="my_car" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            </div>
            <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition">
                Connect to Car
            </button>
        </div>

        <!-- Speed Control Panel -->
        <div class="w-full bg-gray-700 p-4 rounded-xl mb-8 space-y-2 transition-opacity" id="speedPanel" style="opacity: 0.5; pointer-events: none;">
            <div class="flex justify-between items-center text-xs text-gray-400">
                <label>Speed Control</label>
                <span id="speedValue">100%</span>
            </div>
            <input type="range" id="speedSlider" min="0" max="1023" value="1023" class="w-full h-2 bg-gray-900 rounded-lg appearance-none cursor-pointer accent-blue-500">
        </div>

        <!-- D-Pad Controls -->
        <div class="grid grid-cols-3 gap-4 mb-4 relative" id="dpad" style="opacity: 0.5; pointer-events: none;">
            <!-- Top Row -->
            <div></div>
            <button class="control-btn w-20 h-20 bg-gray-700 rounded-2xl shadow-lg flex items-center justify-center text-3xl transition-all" data-cmd="F">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
            </button>
            <div></div>

            <!-- Middle Row -->
            <button class="control-btn w-20 h-20 bg-gray-700 rounded-2xl shadow-lg flex items-center justify-center text-3xl transition-all" data-cmd="L">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="control-btn w-20 h-20 bg-red-600/20 rounded-full shadow-inner flex items-center justify-center text-3xl transition-all border-4 border-gray-800" data-cmd="S">
                <!-- Stop / Center Dot -->
                <div class="w-6 h-6 bg-red-500 rounded-full"></div>
            </button>
            <button class="control-btn w-20 h-20 bg-gray-700 rounded-2xl shadow-lg flex items-center justify-center text-3xl transition-all" data-cmd="R">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>

            <!-- Bottom Row -->
            <div></div>
            <button class="control-btn w-20 h-20 bg-gray-700 rounded-2xl shadow-lg flex items-center justify-center text-3xl transition-all" data-cmd="B">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div></div>
        </div>
        
        <p class="text-xs text-gray-500 mt-4 text-center">Press and hold buttons to move.<br>Release to stop.</p>
    </div>

    <script>
        let client = null;
        let isConnected = false;
        let currentTopic = "";

        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const topicInput = document.getElementById('topicInput');
        const dpad = document.getElementById('dpad');
        const controlBtns = document.querySelectorAll('.control-btn');
        const speedPanel = document.getElementById('speedPanel');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');

        // Function to handle connection
        function toggleConnection() {
            if (isConnected) {
                client.end();
                updateStatus(false, "Disconnected");
                return;
            }

            currentTopic = topicInput.value.trim();
            if (!currentTopic) return alert("Please enter a channel name!");

            updateStatus(false, "Connecting...", "yellow");
            
            // Connect to public EMQX broker over Secure WebSockets
            const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
            const clientId = 'web_remote_' + Math.random().toString(16).substr(2, 8);
            
            client = mqtt.connect(brokerUrl, { clientId: clientId });

            client.on('connect', () => {
                isConnected = true;
                updateStatus(true, "Connected to Car");
                connectBtn.textContent = "Disconnect";
                connectBtn.classList.replace('bg-blue-600', 'bg-red-600');
                connectBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');
                
                // Enable controls
                dpad.style.opacity = '1';
                dpad.style.pointerEvents = 'auto';
                speedPanel.style.opacity = '1';
                speedPanel.style.pointerEvents = 'auto';
            });

            client.on('error', (err) => {
                console.error("Connection error: ", err);
                client.end();
                updateStatus(false, "Connection Failed");
            });

            client.on('close', () => {
                isConnected = false;
                updateStatus(false, "Disconnected");
                connectBtn.textContent = "Connect to Car";
                connectBtn.classList.replace('bg-red-600', 'bg-blue-600');
                connectBtn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
                
                // Disable controls
                dpad.style.opacity = '0.5';
                dpad.style.pointerEvents = 'none';
                speedPanel.style.opacity = '0.5';
                speedPanel.style.pointerEvents = 'none';
            });
        }

        function updateStatus(connected, text, color = null) {
            statusText.textContent = text;
            if (connected) {
                statusIndicator.className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_#22c55e]";
            } else if (color === 'yellow') {
                statusIndicator.className = "w-3 h-3 rounded-full bg-yellow-500 shadow-[0_0_8px_#eab308]";
            } else {
                statusIndicator.className = "w-3 h-3 rounded-full bg-red-500 shadow-[0_0_8px_#ef4444]";
            }
        }

        // Send Command to MQTT
        function sendCommand(cmd) {
            if (isConnected && client) {
                client.publish(currentTopic, cmd);
                console.log("Sent: " + cmd);
            }
        }

        // Speed Slider Event
        speedSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            speedValue.textContent = Math.round((val / 1023) * 100) + '%';
            sendCommand('V' + val); // 'V' stands for Velocity
        });

        connectBtn.addEventListener('click', toggleConnection);

        // Map touch/mouse events to car movements
        controlBtns.forEach(btn => {
            const cmd = btn.getAttribute('data-cmd');
            
            const startInteraction = (e) => {
                e.preventDefault(); // Prevent scrolling/zooming
                btn.classList.add('btn-active');
                sendCommand(cmd); // Send Forward/Back/Left/Right
            };

            const endInteraction = (e) => {
                e.preventDefault();
                btn.classList.remove('btn-active');
                sendCommand('S'); // Send Stop immediately when released
            };

            // Mouse Events for Desktop
            btn.addEventListener('mousedown', startInteraction);
            btn.addEventListener('mouseup', endInteraction);
            btn.addEventListener('mouseleave', (e) => {
                if (btn.classList.contains('btn-active')) endInteraction(e);
            });

            // Touch Events for Mobile
            btn.addEventListener('touchstart', startInteraction, {passive: false});
            btn.addEventListener('touchend', endInteraction, {passive: false});
            btn.addEventListener('touchcancel', endInteraction, {passive: false});
        });

        // Keyboard Controls (Arrow keys and WASD)
        const keyMap = {
            'ArrowUp': 'F',
            'ArrowDown': 'B',
            'ArrowLeft': 'L',
            'ArrowRight': 'R',
            'w': 'F', 'W': 'F',
            's': 'B', 'S': 'B',
            'a': 'L', 'A': 'L',
            'd': 'R', 'D': 'R'
        };

        document.addEventListener('keydown', (e) => {
            // Ignore if the user is typing in the input box or holding the key down (repeating)
            if (document.activeElement === topicInput || e.repeat) return;
            
            const cmd = keyMap[e.key];
            if (cmd) {
                e.preventDefault(); // Prevent screen from scrolling
                sendCommand(cmd);
                // Visually press the on-screen button
                const btn = document.querySelector(`.control-btn[data-cmd="${cmd}"]`);
                if (btn) btn.classList.add('btn-active');
            }
        });

        document.addEventListener('keyup', (e) => {
            if (document.activeElement === topicInput) return;

            const cmd = keyMap[e.key];
            if (cmd) {
                e.preventDefault();
                sendCommand('S'); // Stop when key is released
                // Visually unpress the on-screen button
                const btn = document.querySelector(`.control-btn[data-cmd="${cmd}"]`);
                if (btn) btn.classList.remove('btn-active');
            }
        });
    </script>
</body>
</html>
